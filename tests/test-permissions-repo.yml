name: Test repository permission inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "Iv1.fake-client-id"
          private-key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA2a2rwplBQLF29amygykEMmYz0+Kcj3bKBp29P2rFj7bQkBhm
            ZMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFM
            -----END RSA PRIVATE KEY-----
          skip-token-revoke: "true"
          permission-actions: "read"
          permission-administration: "read"
          permission-artifact-metadata: "read"
          permission-attestations: "read"
          permission-checks: "read"
          permission-code-quality: "read"
          permission-codespaces: "read"
          permission-contents: "read"
          permission-custom-properties-for-organizations: "read"
          permission-dependabot-secrets: "read"
          permission-deployments: "read"
          permission-discussions: "read"
          permission-email-addresses: "read"
          permission-enterprise-custom-properties-for-organizations: "read"
          permission-environments: "read"
          permission-followers: "read"
          permission-git-ssh-keys: "read"
          permission-gpg-keys: "read"
          permission-interaction-limits: "read"
          permission-issues: "read"
          permission-members: "read"
          permission-merge-queues: "read"
          permission-metadata: "read"
      - name: Assert action ran (repository permission inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with repository permission inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
