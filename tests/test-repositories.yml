name: Test repositories input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          client-id: "Iv1.fake-client-id"
          private-key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA2a2rwplBQLF29amygykEMmYz0+Kcj3bKBp29P2rFj7bQkBhm
            ZMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFMzMFM
            -----END RSA PRIVATE KEY-----
          owner: "my-org"
          repositories: "repo-one,repo-two"
          skip-token-revoke: "true"
      - name: Assert action ran (repositories input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with repositories input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
